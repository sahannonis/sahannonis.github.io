name: Daily pins

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * *"    # every day, 05:23 UTC (10:53 in Sri Lanka)
    - cron: "47 16 * * *"   # a second try each day (22:17 in Sri Lanka), in case the first one fails
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Skip if today's pins are already out
        # the evening run is only a backup: if a run already worked today, there is nothing to do
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          done_today=0
          if [ "${{ github.event_name }}" = "schedule" ]; then
            done_today=$(gh run list --repo "${{ github.repository }}" --workflow drip.yml --status success \
              --created ">=$(date -u +%F)" --json databaseId -q length || echo 0)
          fi
          echo "skip=$([ "$done_today" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "successful runs today: $done_today"
      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'
      - name: Build today's feeds
        if: steps.check.outputs.skip != 'true'
        run: python3 tools/build_feeds.py
      - uses: actions/configure-pages@v5
        if: steps.check.outputs.skip != 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.skip != 'true'
        with:
          path: .
      - id: deployment
        if: steps.check.outputs.skip != 'true'
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000   # wait up to 30 minutes when GitHub Pages is slow
      # GitHub sometimes can't find the uploaded site for a minute or two; wait and try again
      - name: Wait before trying again
        if: steps.check.outputs.skip != 'true' && steps.deployment.outcome == 'failure'
        run: sleep 120
      - id: deployment2
        if: steps.check.outputs.skip != 'true' && steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
      - name: Wait longer before the last try
        if: steps.check.outputs.skip != 'true' && steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: sleep 300
      - id: deployment3
        if: steps.check.outputs.skip != 'true' && steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
      - name: Keep the daily schedule switched on
        # GitHub pauses scheduled workflows after 60 quiet days; re-enabling resets that clock.
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable drip.yml --repo "${{ github.repository }}" || true
